<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Austin Events">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1D2E"/>
      <stop offset="1" stop-color="#171018"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5B44C"/>
      <stop offset="1" stop-color="#E8552D"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#sky)"/>
  <circle cx="16" cy="15" r="7.5" fill="url(#sun)"/>
  <!-- horizon -->
  <rect x="4" y="21.5" width="24" height="1.4" rx="0.7" fill="#12897C" opacity="0.9"/>
  <!-- simple skyline silhouettes -->
  <g fill="#171018">
    <rect x="8"  y="16.5" width="2.6" height="5" rx="0.4"/>
    <rect x="14.6" y="12.5" width="2.8" height="9" rx="0.4"/>
    <rect x="17.4" y="10.5" width="1.2" height="4" rx="0.3"/>
    <rect x="21.5" y="15" width="2.6" height="6.5" rx="0.4"/>
  </g>
</svg>
