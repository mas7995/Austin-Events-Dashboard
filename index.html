<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Austin Events 2026</title>
  <meta name="description" content="A year of Austin: festivals, live music, food, film and the big-ticket weekends worth planning around in 2026." />
  <meta name="theme-color" content="#E8552D" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!-- Open Graph / social -->
  <meta property="og:title" content="Austin Events 2026" />
  <meta property="og:description" content="Every marquee Austin event worth planning around this year, in one place." />
  <meta property="og:type" content="website" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />

  <link rel="stylesheet" href="assets/styles.css" />

  <!-- Apply saved theme before first paint to avoid a flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("austin-events-theme");
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>

  <script src="data/events.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
